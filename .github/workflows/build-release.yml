name: Build

on:
  push:
    tags:
     - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: idroriparto-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web release
        run: flutter build web --release --base-href "/idroriparto/"

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: idroriparto-web
          path: build/web

  build-linux-deb:
    name: Build Linux (Debian-based)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update repos
        run: sudo apt update && sudo apt upgrade

      - name: Install required packages
        run: sudo apt install rpm patchelf clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev -y

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: Compile
        run: flutter_distributor release --name=dev --jobs=release-dev-linux-deb

      - name: Upload linux-deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: idroriparto-deb
          path: dist/**/*.deb

  build-linux-rpm:
    name: Build Linux (RPM-based)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update repos
        run: sudo apt update && sudo apt upgrade

      - name: Install required packages
        run: sudo apt install rpm patchelf clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev -y

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: Compile
        run: flutter_distributor release --name=dev --jobs=release-dev-linux-rpm

      - name: Upload linux-rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: idroriparto-rpm
          path: dist/**/*.rpm

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
     contents: write
    needs: [build-linux-deb, build-linux-rpm, build-android, build-web]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download apk artifact
        uses: actions/download-artifact@v4
        with:
          name: idroriparto-apk
          path: build/app/outputs/flutter-apk/

      - name: Download deb artifact
        uses: actions/download-artifact@v4
        with:
          name: idroriparto-deb
          path: dist/deb

      - name: Download rpm artifact
        uses: actions/download-artifact@v4
        with:
          name: idroriparto-rpm
          path: dist/rpm

      - name: Publish web page
        uses: peaceiris/actions-gh-pages@v4
        with:
         github_token: ${{ secrets.GITHUB_TOKEN }}
         publish_dir: build/web
         publish_branch: gh-pages  
          
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/deb/**/*.deb
            dist/rpm/**/*.rpm
            build/app/outputs/flutter-apk/app-release.apk
