name: Build

on:
  push:
    tags:
     - 'v*'
  workflow_dispatch:

jobs:
  verify-release-version:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Match GitHub tag with pubspec version
        shell: bash
        run: |
          # A manual dispatch builds the current revision without publishing a tag.
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            exit 0
          fi

          tag="${GITHUB_REF_NAME#v}"
          raw_version=$(awk '/^version:/ { print $2; exit }' pubspec.yaml)
          version="${raw_version%%+*}"
          build_number="${raw_version#*+}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "pubspec version $version is not a supported SemVer value." >&2
            exit 1
          fi
          if [[ "$raw_version" == "$version" || ! "$build_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "pubspec version must include a positive Android build number, for example 1.0.5+5." >&2
            exit 1
          fi
          if [[ "$tag" != "$version" ]]; then
            echo "Tag v$tag and pubspec version $version do not match." >&2
            exit 1
          fi

  build-android:
    needs: verify-release-version
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Android release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Secret mancante: $variable" >&2
              exit 1
            fi
          done

          keystore_path="$RUNNER_TEMP/idroriparto-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          chmod 600 "$keystore_path"
          keytool -list \
            -keystore "$keystore_path" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: idroriparto-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Remove Android release keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/idroriparto-release.keystore"

  build-web:
    needs: verify-release-version
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web release
        run: flutter build web --release --base-href "/app/"

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: idroriparto-web
          path: build/web

  build-linux-deb:
    needs: verify-release-version
    name: Build Linux (Debian-based)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update repos
        run: sudo apt update && sudo apt upgrade

      - name: Install required packages
        run: sudo apt install rpm patchelf clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev -y

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Get flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: Compile
        run: flutter_distributor release --name=dev --jobs=release-dev-linux-deb

      - name: Upload linux-deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: idroriparto-deb
          path: dist/**/*.deb

  build-linux-rpm:
    needs: verify-release-version
    name: Build Linux (RPM-based)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update repos
        run: sudo apt update && sudo apt upgrade

      - name: Install required packages
        run: sudo apt install rpm patchelf clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev -y

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Get flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: Compile
        run: flutter_distributor release --name=dev --jobs=release-dev-linux-rpm

      - name: Upload linux-rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: idroriparto-rpm
          path: dist/**/*.rpm

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
     contents: write
    needs: [verify-release-version, build-linux-deb, build-linux-rpm, build-android, build-web]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download apk artifact
        uses: actions/download-artifact@v4
        with:
          name: idroriparto-apk
          path: build/app/outputs/flutter-apk/

      - name: Download deb artifact
        uses: actions/download-artifact@v4
        with:
          name: idroriparto-deb
          path: dist/deb

      - name: Download rpm artifact
        uses: actions/download-artifact@v4
        with:
          name: idroriparto-rpm
          path: dist/rpm

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: idroriparto-web
          path: build/web

      - name: Publish web page
        uses: peaceiris/actions-gh-pages@v4
        with:
         github_token: ${{ secrets.GITHUB_TOKEN }}
         publish_dir: build/web
         publish_branch: gh-pages  
          
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/deb/**/*.deb
            dist/rpm/**/*.rpm
            build/app/outputs/flutter-apk/app-release.apk
