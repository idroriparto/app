# Heap per Gradle + compilatore Kotlin (in-process).
# 1024m era troppo basso: "Not enough memory to run compilation".
# Su un PC con 8 GB di RAM lascia 2048m. Con 16 GB+ puoi salire a 4096m.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=true
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
