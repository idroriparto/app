name: idroriparto
description: Ripartizione consumi e spese dell'acqua condominiale.
publish_to: "none"
# Da pubblicare insieme al tag GitHub v1.0.4: il controllo aggiornamenti
# confronta la versione SemVer installata con la tag della release.
version: 1.0.4+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.5.3
  pdf: ^3.11.3
  printing: ^5.14.2
  # Release e metadati dell'app
  http: ^1.6.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  # UI
  forui: ^0.26.0
  material_ui: ^1.0.0
  cupertino_ui: ^1.0.0
  hugeicons: ^1.1.7
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  # L'immagine sorgente è RGBA ma interamente opaca; esporta PNG iOS senza
  # canale alpha, come richiesto dall'App Store.
  remove_alpha_ios: true
  image_path: assets/brand/logo_source.png
  # Il marchio blu è su una base chiara, anche nell'icona adattiva Android.
  adaptive_icon_background: "#FFFFFF"
  # L'asset ha già il margine sicuro previsto per il layer adattivo.
  adaptive_icon_foreground_inset: 0
  adaptive_icon_foreground: assets/brand/logo_mono.png
  adaptive_icon_monochrome: assets/brand/logo_mono.png
  min_sdk_android: 24
  web:
    generate: true
    image_path: assets/brand/logo_source.png
    background_color: "#FFFFFF"
    theme_color: "#FAFAFA"

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo_source.png
    - assets/brand/logo_mono.png
  fonts:
    - family: NimbusSansL
      fonts:
        - asset: assets/fonts/NimbusSansL-Regular.ttf
          weight: 400
        - asset: assets/fonts/NimbusSansL-Bold.ttf
          weight: 700
        - asset: assets/fonts/NimbusSansL-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/NimbusSansL-BoldItalic.ttf
          weight: 700
          style: italic
